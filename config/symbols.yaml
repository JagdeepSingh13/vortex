# Tradable symbols and their units. Single source of truth for every component.
#
# Events carry prices as integer ticks and quantities as integer lots (ADR 0004):
#   price in currency = price_ticks * tick_size
#   quantity in shares = qty_lots * lot_size
#   engine internal price = price_ticks * tick_size * engine_price_scale
#
# Decimal values are strings so no tool ever parses them as binary floats.
#
# Six symbols, two per partition of the 3-partition topics (Kafka's murmur2 hash of the
# symbol): AAPL, MSFT -> 0; GOOGL, NFLX -> 1; AMZN, NVDA -> 2 (ADR 0013).
# reference_price is only a starting point for the simulator's random walk.

version: 1

# the engine's fixed-point scale (core::PRICE_SCALE): internal price = currency * 10000
engine_price_scale: 10000

symbols:
  - symbol: AAPL
    currency: USD
    tick_size: "0.01"
    lot_size: 1
    price_decimals: 2
    reference_price: "190.00"

  - symbol: MSFT
    currency: USD
    tick_size: "0.01"
    lot_size: 1
    price_decimals: 2
    reference_price: "415.00"

  - symbol: GOOGL
    currency: USD
    tick_size: "0.01"
    lot_size: 1
    price_decimals: 2
    reference_price: "175.00"

  - symbol: NFLX
    currency: USD
    tick_size: "0.01"
    lot_size: 1
    price_decimals: 2
    reference_price: "650.00"

  - symbol: AMZN
    currency: USD
    tick_size: "0.01"
    lot_size: 1
    price_decimals: 2
    reference_price: "185.00"

  - symbol: NVDA
    currency: USD
    tick_size: "0.01"
    lot_size: 1
    price_decimals: 2
    reference_price: "120.00"
