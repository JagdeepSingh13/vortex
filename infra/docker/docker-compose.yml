# Local infrastructure. Started with `make up`, stopped with `make down` (ADR 0012).
# Services are added by the milestone that first needs them.
name: vortex

services:

  # single Kafka node in KRaft mode: one process is both broker and controller,
  # no ZooKeeper (Kafka 4.x removed it entirely)
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: vortex-kafka
    ports:
      - "9092:9092"   # EXTERNAL listener, for programs on the host (localhost:9092)
    environment:
      # fixed id so the data volume stays valid across restarts (kafka-storage.sh random-uuid)
      CLUSTER_ID: fU3YqNjuR_iI-nvHIchbRQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # three listeners on three ports:
      #   INTERNAL  kafka:29092     other containers on the compose network (engine, Spark)
      #   EXTERNAL  localhost:9092  programs on the host
      #   CONTROLLER kafka:9093     KRaft controller traffic, never used by clients
      # "advertised" is the address the broker tells clients to reconnect to, so it
      # must be reachable from where that client runs
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # one broker, so every internal topic can only have one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # topics are created on purpose by `make topics`, never by a typo in a client
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # consumers in a new group start right away instead of waiting 3 s for others
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # the WSL2 VM has ~3.7 GB; a fixed 512 MB heap leaves room for Spark later
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # cheap TCP check (no JVM start): is the client port accepting connections?
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # optional web UI: only starts with `make up-ui` (compose profile "ui")
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: vortex-kafka-ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vortex
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: -Xmx256m

  # S3-compatible object store for Iceberg data files (ADR 0016). One process runs
  # SeaweedFS's master, volume server, filer and S3 gateway. MinIO stopped publishing images.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: vortex-seaweedfs
    ports:
      - "8333:8333"   # S3 API, for tools on the host
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env (copy .env.example)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (copy .env.example)}
    # the S3 identity file is written from .env at start, so no key is ever stored in git
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities": [{"name": "vortex",
          "credentials": [{"accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}"}],
          "actions": ["Admin", "Read", "List", "Tagging", "Write"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Iceberg REST catalog: maps table names to their current metadata file (ADR 0016).
  # The reference implementation; its own pointers live in SQLite on a volume.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1@sha256:f7d679d30ac9c640bdeb2c015dff533cd3c8f1c7d491ebcb5d436f9a42db1d6f
    container_name: vortex-iceberg-rest
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      CATALOG_URI: jdbc:sqlite:/tmp/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${S3_ACCESS_KEY}
      CATALOG_S3_SECRET__ACCESS__KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
      JAVA_TOOL_OPTIONS: -Xmx256m
    volumes:
      - iceberg-catalog:/tmp
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8181"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # live market data, the hot path (ADR 0017): last price and current candles per symbol,
  # written by the api service on every trade. In memory only: everything here can be rebuilt
  # from Kafka, and the lakehouse keeps the authoritative history.
  redis:
    image: redis:8.8.2-alpine@sha256:f4ded511357f7c60551133fbceb0d07874a2240bfe3d1baaa49769a70ff83465
    container_name: vortex-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # streaming job: Kafka "trades" -> Iceberg vortex.bronze.trades (ADR 0016). Only with
  # `make stream-bronze` (profile "stream"). Its checkpoint volume must be deleted together with
  # the table (make reset does both), or the two would disagree about what was already written.
  bronze:
    build:
      context: .
      dockerfile: spark.Dockerfile
    image: vortex/spark:m6
    container_name: vortex-bronze
    profiles: ["stream"]
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
      CHECKPOINT_DIR: /opt/spark/checkpoints/bronze_trades
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS:-10}
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g",
              "/opt/vortex/streaming/bronze_trades.py"]
    volumes:
      - ../../streaming:/opt/vortex/streaming:ro
      - spark-checkpoints:/opt/spark/checkpoints

volumes:
  kafka-data:
  seaweedfs-data:
  iceberg-catalog:
  spark-checkpoints:
